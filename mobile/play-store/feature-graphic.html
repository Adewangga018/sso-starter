<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
  .wrap {
    width: 1024px; height: 500px; background: #0f261f; position: relative;
    display: flex; align-items: center; padding: 0 72px; gap: 44px;
  }
  .accent-circle {
    position: absolute; top: -120px; right: -120px; width: 420px; height: 420px;
    border-radius: 50%; background: radial-gradient(circle, rgba(244,174,70,0.22), transparent 70%);
  }
  .line { position: absolute; inset: 28px; border: 1px solid rgba(244,174,70,0.3); }
  img.icon { width: 168px; height: 168px; border-radius: 38px; flex-shrink: 0; box-shadow: 0 20px 40px rgba(0,0,0,0.35); }
  .title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 64px; color: #ffffff; line-height: 1; letter-spacing: -0.01em; }
  .sub { font-size: 22px; color: rgba(255,255,255,0.75); margin-top: 16px; font-weight: 500; }
  .bar { width: 60px; height: 5px; background: #f4ae46; margin-top: 20px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="accent-circle"></div>
    <div class="line"></div>
    <img class="icon" src="../assets/icon/app_icon.png" />
    <div>
      <div class="title">MyGCS Absensi</div>
      <div class="bar"></div>
      <div class="sub">Presensi Karyawan PT Gresik Cipta Sejahtera</div>
    </div>
  </div>
</body>
</html>
